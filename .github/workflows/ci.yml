name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", LICENSE]
  pull_request:
    paths-ignore: ["**.md", LICENSE]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から読む
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
