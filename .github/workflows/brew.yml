name: Brew caffeine meter

on:
  schedule:
    - cron: "23 */3 * * *" # 3時間ごと
  workflow_dispatch:

permissions:
  contents: read

# Pages へのデプロイ中に次の実行が割り込まないよう、取り消さずに順番に流す
concurrency:
  group: brew
  cancel-in-progress: false

jobs:
  # 配布している Action（リポジトリ直下の action.yml）を自分で使って、noonyuu のメーターを更新する
  brew:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.meter.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        id: meter
        with:
          format: webp
