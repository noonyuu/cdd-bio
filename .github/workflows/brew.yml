name: Brew caffeine meter

on:
  schedule:
    - cron: "23 */3 * * *" # 3時間ごと
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Pages へのデプロイ中に次の実行が割り込まないよう、取り消さずに順番に流す
concurrency:
  group: brew
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から読む
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # 配布している Action（リポジトリ直下の action.yml）を自分で使って、noonyuu のメーターを更新する
  brew:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.meter.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./
        id: meter
        with:
          format: webp
